name: mygo_mobile
description: "MyGo 音乐 — a mobile player that runs MyGo Music plugins (plugin.json + index.js) unchanged."
publish_to: 'none'
version: 0.2.1+4

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_parsing: ^1.1.0
  ffi: ^2.2.0
  crypto: ^3.0.8
  pointycastle: ^4.0.0
  archive: ^4.6.0
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  file_picker: ^13.3.2
  app_links: ^7.2.2
  http: ^1.6.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: any

flutter:
  uses-material-design: true
  assets:
    - assets/js/prelude.js

dependency_overrides:
  # 2.3.x pulls in package:jni, which compiles C with the NDK toolchain at build time.
  path_provider_android: 2.2.23
